<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밤티학교 부수기 - 스트레스 해소 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
            background: linear-gradient(to bottom, #0f172a, #1e1b4b);
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        .btn-select {
            transition: all 0.2s ease-in-out;
        }
        .btn-select.active {
            border-color: #f59e0b;
            background-color: #374151;
            transform: scale(1.03);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        }
        .pulse-btn {
            animation: pulse 1.2s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }
        .transform-banner {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.3) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-between text-white p-2 sm:p-3 relative">

    <!-- Top UI Bar (Vertical Layout Optimized) -->
    <header class="w-full max-w-md px-3 py-2 flex flex-col gap-2 z-10 bg-slate-900/90 backdrop-blur rounded-2xl shadow-xl border border-slate-700">

        <div class="flex items-center justify-between">

                </div>

                    <h1 class="text-xl sm:text-2xl text-amber-400 tracking-wide font-extrabold drop-shadow">밤티학교 부수기</h1>
                    <p class="text-[11px] text-slate-400">3콤보를 달성하여 변신해보세요!</p>
                </div>
            </div>
            <div class="flex gap-1.5">
                <button id="sound-btn" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-sm shadow border border-slate-600">

                </button>
                <button id="reset-btn" class="bg-rose-600 hover:bg-rose-500 active:scale-95 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold shadow transition border border-rose-400 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 다시짓기

        <!-- School Health Bar & Combo Status -->

            <div class="flex justify-between text-xs font-bold">
                <span id="school-name-display" class="text-cyan-400">명호초등학교 (부산)</span>
                <span id="status-text" class="text-emerald-400">내구도: 100%</span>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-3.5 p-0.5 border border-slate-700 shadow-inner overflow-hidden">
                <div id="hp-bar" class="bg-gradient-to-r from-emerald-400 via-amber-400 to-red-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
            </div>

    <!-- Center Game Canvas Area (Mobile Vertical Proportions) -->

                    <div id="trans-sub" class="text-[10px] sm:text-xs text-slate-200">공격 시 "난또까 나레!" 음성이 발동됩니다</div>
                </div>

        <!-- School Destruction Completion Modal -->
        <div id="clear-modal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col justify-center items-center z-30 transition-all p-4">
            <div class="bg-slate-900 border-4 border-amber-400 rounded-3xl p-6 text-center shadow-2xl pulse-btn max-w-xs">
                <div class="text-5xl text-amber-400 mb-2">💥🏫🔥</div>
                <h2 class="text-2xl sm:text-3xl text-white font-extrabold mb-1">학교 완파 완료!</h2>
                <p id="clear-desc" class="text-xs text-slate-300 mb-5">학교가 흔적도 없이 사라졌습니다.<br>오늘의 스트레스 완전 해소!</p>
                <button id="modal-reset-btn" class="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-extrabold text-base px-6 py-2.5 rounded-2xl shadow-xl active:scale-95 transition">
                    🔄 다시 부수기
                </button>
            </div>

    </main>

    <!-- Bottom Selection Controls (Vertical Mobile Layout) -->
    <footer class="w-full max-w-md px-3 py-2 z-10 bg-slate-900/90 backdrop-blur rounded-2xl shadow-2xl border border-slate-700 flex flex-col gap-2">
        <div class="grid grid-cols-2 gap-2">
            <!-- 1. School Selector -->
            <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700 flex flex-col gap-1">
                <span class="text-[11px] text-amber-400 font-bold flex items-center gap-1">
                    <i class="fa-solid fa-school"></i> 1. 학교 선택
                </span>
                <div class="grid grid-cols-2 gap-1">
                    <button data-school="myungho" class="school-btn btn-select active p-1.5 rounded-lg bg-slate-700 text-xs font-bold border border-slate-600">
                        🎒 명호초
                    </button>
                    <button data-school="sindo" class="school-btn btn-select p-1.5 rounded-lg bg-slate-700 text-xs font-bold border border-slate-600">
                        🏢 신도고
                    </button>
                </div>
            </div>

            <!-- 2. Character Selector -->
            <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700 flex flex-col gap-1">
                <span class="text-[11px] text-amber-400 font-bold flex items-center gap-1">
                    <i class="fa-solid fa-user-ninja"></i> 2. 캐릭터 선택
                </span>
                <div class="grid grid-cols-2 gap-1">
                    <button data-char="hyechaeng" class="char-btn btn-select active p-1.5 rounded-lg bg-slate-700 text-xs font-bold border border-slate-600 flex items-center justify-center gap-0.5">
                        <span>👩‍🦱</span> 혜챙

                        <span>👓</span> 주챙

                </div>

        </div>

        <!-- 3. Weapon Selector -->
        <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700 flex flex-col gap-1">
            <span class="text-[11px] text-amber-400 font-bold flex items-center gap-1">
                <i class="fa-solid fa-gun"></i> 3. 파괴 무기 선택
            </span>
            <div class="grid grid-cols-5 gap-1">
                <button data-weapon="hammer" class="weapon-btn btn-select active p-1 rounded-lg bg-slate-700 text-center text-xs border border-slate-600" title="망치">
                    <div class="text-base">🔨</div>
                    <div class="text-[10px]">망치</div>
                </button>
                <button data-weapon="wrecking" class="weapon-btn btn-select p-1 rounded-lg bg-slate-700 text-center text-xs border border-slate-600" title="철퇴">
                    <div class="text-base">🏗️</div>
                    <div class="text-[10px]">철퇴</div>
                </button>
                <button data-weapon="dynamite" class="weapon-btn btn-select p-1 rounded-lg bg-slate-700 text-center text-xs border border-slate-600" title="폭탄">
                    <div class="text-base">🧨</div>
                    <div class="text-[10px]">폭탄</div>
                </button>
                <button data-weapon="laser" class="weapon-btn btn-select p-1 rounded-lg bg-slate-700 text-center text-xs border border-slate-600" title="레이저">
                    <div class="text-base">⚡</div>
                    <div class="text-[10px]">레이저</div>
                </button>
                <button data-weapon="meteor" class="weapon-btn btn-select p-1 rounded-lg bg-slate-700 text-center text-xs border border-slate-600" title="운석">
                    <div class="text-base">☄️</div>
                    <div class="text-[10px]">운석</div>
                </button>
            </div>
        </div>
    </footer>

    <!-- Game Engine & Audio Script -->
    <script>
        // --- Web Audio & Speech Engine Generator ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.synth = window.speechSynthesis || null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            // Speak Voice for Transformed Forms ("난또까 나레", "아하잇")
            speak(text, pitch = 1.4, speed = 1.2) {
                if (this.muted) return;
                
                // Web Audio Chirp Fallback + SpeechSynthesis
                this.playVoiceChirp(pitch);

                if (this.synth) {
                    this.synth.cancel(); // cancel previous phrase for snappy feel
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'ja-JP'; // Expressive Japanese pronunciation for Chiikawa phrases
                    utter.pitch = pitch;
                    utter.rate = speed;
                    utter.volume = 1.0;
                    this.synth.speak(utter);
                }
            }

            playVoiceChirp(pitchFactor = 1.0) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450 * pitchFactor, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850 * pitchFactor, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            playHit() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playExplosion() {
                if (this.muted) return;
                this.init();
                const bufferSize = this.ctx.sampleRate * 0.35;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(650, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.35);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playLaser() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(950, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playMeteor() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }

            playVoice() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500 + Math.random() * 200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
        }

        const sound = new SoundEngine();

        // --- Game Setup & Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentSchool = 'myungho';
        let currentCharacter = 'hyechaeng';
        let currentWeapon = 'hammer';

        let blocks = [];
        let particles = [];
        let floatingTexts = [];
        let companions = [];
        
        let screenShake = 0;
        let comboCount = 0;
        let lastHitTime = 0;
        let totalBlocksCount = 0;
        let isCleared = false;
        let isTransformed = false;
        let speechBubbleTimer = 0;
        let currentAttackSpeech = '';

        let mouseX = 0;
        let mouseY = 0;
        let isAttacking = false;

        // Colors Palette
        const COLORS = {
            brickYellow: '#fef08a',
            brickOrange: '#fb923c',
            brickRed: '#ef4444',
            brickBlue: '#38bdf8',
            sindoBrick: '#94a3b8',
            sindoDark: '#334155',
            roofBlue: '#0284c7',
            roofRed: '#dc2626',
            glass: '#a5f3fc',
            clockFace: '#ffffff',
            ground: '#334155',
            grass: '#22c55e'
        };

        // Resize Canvas for Mobile / Desktop Container
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            initGame();
        }

        window.addEventListener('resize', resizeCanvas);

        // --- Block Class ---
        class Block {
            constructor(x, y, width, height, color, type = 'normal') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.type = type;
                this.hp = type === 'glass' ? 1 : 2;
                this.maxHp = this.hp;
                this.destroyed = false;
            }

            draw() {
                if (this.destroyed) return;

                ctx.save();
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                ctx.strokeStyle = 'rgba(0,0,0,0.18)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);

                if (this.type === 'glass') {
                    ctx.fillStyle = 'rgba(255,255,255,0.45)';
                    ctx.fillRect(this.x + 2, this.y + 2, this.width / 2, this.height / 2);
                } else if (this.type === 'clock') {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y + this.height / 2, Math.min(this.width, this.height) * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.width / 2, this.y + this.height / 2);
                    ctx.lineTo(this.x + this.width / 2, this.y + this.height * 0.25);
                    ctx.moveTo(this.x + this.width / 2, this.y + this.height / 2);
                    ctx.lineTo(this.x + this.width * 0.7, this.y + this.height / 2);
                    ctx.stroke();
                } else if (this.type === 'crest') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.font = 'bold 10px Jua';
                    ctx.textAlign = 'center';
                    ctx.fillText('🏫', this.x + this.width / 2, this.y + this.height * 0.7);
                }

                if (this.hp < this.maxHp) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 2, this.y + 2);
                    ctx.lineTo(this.x + this.width - 2, this.y + this.height - 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            hit(damage, angle = 0) {
                if (this.destroyed) return false;
                this.hp -= damage;
                
                const particleCount = this.hp <= 0 ? 6 : 2;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(
                        this.x + this.width / 2,
                        this.y + this.height / 2,
                        this.color,
                        angle
                    ));
                }

                if (this.hp <= 0) {
                    this.destroyed = true;
                    return true;
                }
                return false;
            }
        }

        // --- Particle Class ---
        class Particle {
            constructor(x, y, color, baseAngle = 0) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 5 + 2.5;
                const speed = Math.random() * 5 + 2;
                const angle = baseAngle + (Math.random() - 0.5) * Math.PI;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - Math.random() * 2.5;
                this.gravity = 0.35;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        // --- Floating Text Class ---
        class FloatingText {
            constructor(x, y, text, color = '#f59e0b') {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.vy = -2;
            }

            update() {
                this.y += this.vy;
                this.alpha -= 0.025;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'extrabold 20px Jua';
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // --- Companion Class (Chiikawa, Hachiware, Usagi) ---
        class Companion {
            constructor(name, x, y, emoji, color) {
                this.name = name;
                this.x = x;
                this.y = y;
                this.emoji = emoji;
                this.color = color;
                this.state = 'idle';
                this.timer = 0;
                this.speech = '';
            }

            react() {
                this.state = 'surprised';
                this.timer = 40;
                const lines = {
                    '치이카와': ['와아-!!', '응아...!', '히익!'],
                    '하치와레': ['자, 잠깐만!', '난또까 나레?!', '학교가...!!'],
                    '우사기': ['우라-!!', '아하잇!!', '풀-야!!']
                };
                const choices = lines[this.name] || ['앗!'];
                this.speech = choices[Math.floor(Math.random() * choices.length)];
                sound.playVoice();
            }

            update() {
                if (this.timer > 0) {
                    this.timer--;
                    if (this.timer === 0) {
                        this.state = 'idle';
                        this.speech = '';
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.state === 'surprised') {
                    ctx.translate(0, -Math.sin(this.timer * 0.3) * 6);
                }

                // Chiikawa Style Body
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (this.name === '하치와레') {
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.arc(-8, -12, 7, 0, Math.PI * 2);
                    ctx.arc(8, -12, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (this.name === '우사기') {
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.ellipse(-8, -20, 5, 13, -0.2, 0, Math.PI * 2);
                    ctx.ellipse(8, -20, 5, 13, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.fillStyle = '#000000';
                if (this.state === 'surprised') {
                    ctx.beginPath();
                    ctx.arc(-6, -2, 2.5, 0, Math.PI * 2);
                    ctx.arc(6, -2, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 5, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(-6, -2, 2, 0, Math.PI * 2);
                    ctx.arc(6, -2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath();
                    ctx.arc(-10, 2, 3, 0, Math.PI * 2);
                    ctx.arc(10, 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.speech) {
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(-26, -48, 52, 20, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 11px Jua';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.speech, 0, -34);
                }

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '10px Jua';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, 0, 28);

                ctx.restore();
            }
        }

        // --- Init Game & Build School (Mobile Responsive Layout) ---
        function initGame() {
            blocks = [];
            particles = [];
            floatingTexts = [];
            companions = [];
            isCleared = false;
            comboCount = 0;
            isTransformed = false;
            speechBubbleTimer = 0;
            document.getElementById('clear-modal').classList.add('hidden');
            document.getElementById('trans-banner').classList.add('hidden');

            const bw = Math.floor(canvas.width / 18); // Dynamic block width for mobile
            const bh = 18;
            const startX = Math.floor(canvas.width / 2);
            const groundY = Math.floor(canvas.height * 0.78);

            if (currentSchool === 'myungho') {
                document.getElementById('school-name-display').innerText = '명호초등학교 (부산)';
                
                const rows = 9;
                const cols = 15;
                const leftX = startX - (cols * bw) / 2;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const bx = leftX + c * bw;
                        const by = groundY - (rows - r) * bh;

                        let color = COLORS.brickYellow;
                        let type = 'normal';

                        if (r === 0) {
                            color = COLORS.roofRed;
                        } else if (r % 2 === 1 && c % 3 === 1 && c > 1 && c < cols - 2) {
                            color = COLORS.glass;
                            type = 'glass';
                        } else if (r <= 2 && c >= 6 && c <= 8) {
                            if (r === 1 && c === 7) {
                                color = COLORS.clockFace;
                                type = 'clock';
                            } else {
                                color = COLORS.brickOrange;
                            }
                        } else if (r >= 6 && c >= 6 && c <= 8) {
                            color = COLORS.brickOrange;
                            if (r === 6 && c === 7) type = 'crest';
                        }

                        blocks.push(new Block(bx, by, bw, bh, color, type));
                    }
                }
            } else {
                document.getElementById('school-name-display').innerText = '신도고등학교 (부산)';

                const rows = 11;
                const cols = 17;
                const leftX = startX - (cols * bw) / 2;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const bx = leftX + c * bw;
                        const by = groundY - (rows - r) * bh;

                        let color = COLORS.sindoBrick;
                        let type = 'normal';

                        if (r === 0) {
                            color = COLORS.roofBlue;
                        } else if (r % 2 === 0 && (c % 2 === 0) && c > 0 && c < cols - 1) {
                            color = COLORS.glass;
                            type = 'glass';
                        } else if (r >= 7 && c >= 7 && c <= 9) {
                            color = COLORS.sindoDark;
                            if (r === 7 && c === 8) type = 'crest';
                        }

                        blocks.push(new Block(bx, by, bw, bh, color, type));
                    }
                }
            }

            totalBlocksCount = blocks.length;

            // Spawn Guest NPCs
            companions = [
                new Companion('치이카와', startX - 110, groundY + 12, '🥚', '#ffffff'),
                new Companion('하치와레', startX + 110, groundY + 12, '🐱', '#38bdf8'),
                new Companion('우사기', startX, groundY + 20, '🐰', '#fef08a')
            ];

            updateUI();
        }

        // --- Trigger 3-Combo Transformation ---
        function checkTransformation() {
            if (comboCount >= 3 && !isTransformed) {
                isTransformed = true;
                screenShake = 15;

                const transBanner = document.getElementById('trans-banner');
                const transEmoji = document.getElementById('trans-emoji');
                const transTitle = document.getElementById('trans-title');
                const transSub = document.getElementById('trans-sub');

                if (currentCharacter === 'hyechaeng') {
                    // 혜챙 -> 일귀와레 (귀 하나 하치와레)
                    transEmoji.innerText = '🐱⚡';
                    transTitle.innerText = '혜챙 ➔ 일귀와레 변신!';
                    transSub.innerText = '공격시 음성 "난또까 나레!" 발동!';
                } else {
                    // 주챙 -> 빨간 우사기
                    transEmoji.innerText = '🐰🔥';
                    transTitle.innerText = '주챙 ➔ 빨간 우사기 변신!';
                    transSub.innerText = '공격시 음성 "아하잇!" 발동!';
                }

                transBanner.classList.remove('hidden');
                setTimeout(() => {
                    transBanner.classList.add('hidden');
                }, 2200);

                // Transformation Sound Effect
                sound.playVoiceChirp(1.6);
            }
        }

        // --- Attack Logic & Voice Triggering ---
        function executeAttack(x, y) {
            if (isCleared) return;

            const now = Date.now();
            if (now - lastHitTime < 1600) {
                comboCount++;
            } else {
                comboCount = 1;
                isTransformed = false;
            }
            lastHitTime = now;

            // Check & Apply Transformation on 3+ Combo
            checkTransformation();

            // Transformed Voice Attack Audio & Speech Bubble
            if (isTransformed) {
                speechBubbleTimer = 35; // Frames for speech bubble
                if (currentCharacter === 'hyechaeng') {
                    // 일귀와레 공격 음성
                    currentAttackSpeech = '난또까 나레!';
                    sound.speak('なんとかなれ', 1.35, 1.3);
                } else {
                    // 빨간 우사기 공격 음성
                    currentAttackSpeech = '아하잇!';
                    sound.speak('あはいっ', 1.7, 1.4);
                }
            }

            // Companions React
            companions.forEach(comp => comp.react());

            let radius = 40;
            let damage = isTransformed ? 3 : 1.5; // Damage Boost when Transformed

            switch (currentWeapon) {
                case 'hammer':
                    radius = 45;
                    screenShake = 6;
                    sound.playHit();
                    break;
                case 'wrecking':
                    radius = 80;
                    screenShake = 12;
                    sound.playExplosion();
                    break;
                case 'dynamite':
                    radius = 110;
                    screenShake = 18;
                    sound.playExplosion();
                    for (let i = 0; i < 20; i++) {
                        particles.push(new Particle(x, y, '#f97316', Math.random() * Math.PI * 2));
                        particles.push(new Particle(x, y, '#ef4444', Math.random() * Math.PI * 2));
                    }
                    break;
                case 'laser':
                    radius = 30;
                    screenShake = 5;
                    sound.playLaser();
                    break;
                case 'meteor':
                    radius = 140;
                    screenShake = 22;
                    sound.playMeteor();
                    sound.playExplosion();
                    for (let i = 0; i < 35; i++) {
                        particles.push(new Particle(x, y, '#f59e0b', Math.random() * Math.PI * 2));
                    }
                    break;
            }

            // Apply Damage to School Blocks
            blocks.forEach(b => {
                if (b.destroyed) return;
                const bx = b.x + b.width / 2;
                const by = b.y + b.height / 2;
                const dist = Math.hypot(bx - x, by - y);
                const isLaserHit = (currentWeapon === 'laser' && Math.abs(bx - x) < 22);

                if (dist < radius || isLaserHit) {
                    const angle = Math.atan2(by - y, bx - x);
                    b.hit(damage, angle);
                }
            });

            // Combo Floating Banner
            if (comboCount > 1) {
                const comboLabel = isTransformed ? `${comboCount} COMBO (MAX)!` : `${comboCount} COMBO!`;
                const comboColor = isTransformed ? '#ec4899' : '#fbbf24';
                floatingTexts.push(new FloatingText(x, y - 25, comboLabel, comboColor));
            }

            updateUI();
        }

        // --- UI Updates ---
        function updateUI() {
            const activeBlocks = blocks.filter(b => !b.destroyed).length;
            const hpPercent = Math.max(0, Math.round((activeBlocks / totalBlocksCount) * 100));

            const hpBar = document.getElementById('hp-bar');
            const statusText = document.getElementById('status-text');
            const comboText = document.getElementById('combo-text');
            const transStatus = document.getElementById('transform-status');

            hpBar.style.width = `${hpPercent}%`;
            statusText.innerText = `내구도: ${hpPercent}%`;
            comboText.innerText = `${comboCount} COMBO`;

            if (isTransformed) {
                if (currentCharacter === 'hyechaeng') {
                    transStatus.innerText = '⚡ 일귀와레 변신중!';
                    transStatus.className = 'bg-cyan-500 text-slate-950 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold animate-pulse';
                } else {
                    transStatus.innerText = '🔥 빨간 우사기 변신중!';
                    transStatus.className = 'bg-rose-500 text-white px-2.5 py-0.5 rounded-full text-[11px] font-extrabold animate-pulse';
                }
            } else {
                transStatus.innerText = '변신 대기중 (3콤보 필요)';
                transStatus.className = 'bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-[11px] border border-slate-600 font-bold';
            }

            if (hpPercent === 0 && !isCleared) {
                isCleared = true;
                setTimeout(() => {
                    document.getElementById('clear-modal').classList.remove('hidden');
                }, 300);
            }
        }

        // --- Render Attacker Character (혜챙 -> 일귀와레 / 주챙 -> 빨간 우사기) ---
        function drawAttackerCharacter() {
            const charX = mouseX;
            const charY = Math.min(mouseY, canvas.height * 0.88);

            ctx.save();
            ctx.translate(charX, charY);

            // Ground Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 38, 18, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Transformation Aura Visuals
            if (isTransformed) {
                ctx.fillStyle = currentCharacter === 'hyechaeng' ? 'rgba(56, 189, 248, 0.35)' : 'rgba(239, 68, 68, 0.4)';
                ctx.beginPath();
                ctx.arc(0, 0, 30 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 혜챙 Mode ---
            if (currentCharacter === 'hyechaeng') {
                if (isTransformed) {
                    // === 일귀와레 (귀 하나인 하치와레) ===
                    // Cat Body
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // ONE Ear Blue Cap (일귀와레 특유의 외귀 디자인)
                    ctx.fillStyle = '#0284c7';
                    ctx.beginPath();
                    ctx.arc(-10, -14, 9, 0, Math.PI * 2); // Only Left Ear
                    ctx.fill();
                    ctx.stroke();

                    // Eyes & Expression
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(-7, -2, 2.5, 0, Math.PI * 2);
                    ctx.arc(7, -2, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Pink Cheeks
                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath();
                    ctx.arc(-11, 3, 3, 0, Math.PI * 2);
                    ctx.arc(11, 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // === 일반 혜챙 (단발머리) ===
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(0, -4, 22, Math.PI, Math.PI * 2);
                    ctx.fillRect(-22, -4, 44, 18);
                    ctx.fill();

                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(0, 0, 16, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(-5, -2, 2.5, 0, Math.PI * 2);
                    ctx.arc(5, -2, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ec4899';
                    ctx.fillRect(-10, 14, 20, 20);
                }
            } 
            // --- 주챙 Mode ---
            else {
                if (isTransformed) {
                    // === 빨간 우사기 (Red Usagi) ===
                    // Vibrant Red Rabbit Body
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#7f1d1d';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Long Red Rabbit Ears
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.ellipse(-9, -24, 6, 15, -0.2, 0, Math.PI * 2);
                    ctx.ellipse(9, -24, 6, 15, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Wild Expression Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-7, -3, 4, 0, Math.PI * 2);
                    ctx.arc(7, -3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(-7, -3, 2, 0, Math.PI * 2);
                    ctx.arc(7, -3, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // === 일반 주챙 (안경 남성) ===
                    ctx.fillStyle = '#334155';
                    ctx.beginPath();
                    ctx.arc(0, -5, 18, Math.PI, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(0, 0, 16, 0, Math.PI * 2);
                    ctx.fill();

                    // Glasses
                    ctx.strokeStyle = '#0284c7';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-10, -5, 8, 6);
                    ctx.strokeRect(2, -5, 8, 6);

                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(-6, -2, 2, 0, Math.PI * 2);
                    ctx.arc(6, -2, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(-10, 14, 20, 20);
                }
            }

            // Weapon Icon in Hand
            let weaponEmoji = '🔨';
            if (currentWeapon === 'wrecking') weaponEmoji = '🏗️';
            if (currentWeapon === 'dynamite') weaponEmoji = '🧨';
            if (currentWeapon === 'laser') weaponEmoji = '⚡';
            if (currentWeapon === 'meteor') weaponEmoji = '☄️';

            ctx.font = '22px Jua';
            ctx.fillText(weaponEmoji, 14, 8);

            // Transformed Voice Speech Bubble ("난또까 나레!" / "아하잇!")
            if (speechBubbleTimer > 0 && isTransformed) {
                speechBubbleTimer--;
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-45, -55, 90, 26, 10);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#dc2626';
                ctx.font = 'extrabold 13px Jua';
                ctx.textAlign = 'center';
                ctx.fillText(currentAttackSpeech, 0, -38);
            }

            ctx.restore();
        }

        // --- Main Game Animation Loop ---
        function animate() {
            ctx.save();

            // Screen Shake Logic
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake *= 0.88;
                if (screenShake < 0.2) screenShake = 0;
            }

            // Canvas Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground & Grass
            const groundY = canvas.height * 0.78;
            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = COLORS.grass;
            ctx.fillRect(0, groundY, canvas.width, 8);

            // Draw School Bricks
            blocks.forEach(b => b.draw());

            // Draw Chiikawa Friends
            companions.forEach(c => {
                c.update();
                c.draw();
            });

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Draw Floating Text (Combo Counters)
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.update();
                ft.draw();
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            // Draw Laser Beam FX
            if (isAttacking && currentWeapon === 'laser') {
                ctx.strokeStyle = isTransformed ? '#f43f5e' : '#38bdf8';
                ctx.lineWidth = 14;
                ctx.shadowColor = '#0284c7';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(mouseX, 0);
                ctx.lineTo(mouseX, canvas.height);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Draw Active Player Character
            drawAttackerCharacter();

            ctx.restore();
            requestAnimationFrame(animate);
        }

        // --- Event Listeners (Touch & Mouse Support) ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            isAttacking = true;
            executeAttack(mouseX, mouseY);
        });

        canvas.addEventListener('mouseup', () => {
            isAttacking = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
            isAttacking = true;
            executeAttack(mouseX, mouseY);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isAttacking = false;
        });

        // Selector Buttons Listeners
        document.querySelectorAll('.school-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.school-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                currentSchool = target.dataset.school;
                initGame();
            });
        });

        document.querySelectorAll('.char-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                currentCharacter = target.dataset.char;
                isTransformed = false;
                comboCount = 0;
                updateUI();
            });
        });

        document.querySelectorAll('.weapon-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                currentWeapon = target.dataset.weapon;
            });
        });

        // Sound Mute Toggle
        document.getElementById('sound-btn').addEventListener('click', () => {
            sound.muted = !sound.muted;
            const icon = document.getElementById('sound-icon');
            if (sound.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
            } else {
                icon.className = 'fa-solid fa-volume-high text-amber-400';
            }
        });

        // Reset Buttons
        document.getElementById('reset-btn').addEventListener('click', initGame);
        document.getElementById('modal-reset-btn').addEventListener('click', initGame);

        // Start Loop
        window.onload = () => {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
